[project]
name = "nl-view-mcp"
version = "0.1.0"
description = "Viability prototype: natural-language instruction -> declarative widget spec via one MCP tool"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0",
    "python-dotenv",
    "anthropic",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
